openapi: 3.1.0
info:
  title: DMI Backend actions ontology-chat API
  version: 0.1.0
tags:
- name: ontology-chat
paths:
  /api/v1/ontology/chats/{chat_id}/message:
    post:
      tags:
      - ontology-chat
      summary: Ontology Chat Message
      description: Send a message to the ontology design advisor.
      operationId: ontology_chat_message_api_v1_ontology_chats__chat_id__message_post
      parameters:
      - name: chat_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Chat Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OntologyChatMessageRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OntologyChatMessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    OntologyChatMessageRequest:
      properties:
        content:
          type: string
          title: Content
      type: object
      required:
      - content
      title: OntologyChatMessageRequest
      description: Send a message to the ontology advisor.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    OntologyChatMessageResponse:
      properties:
        status:
          type: string
          title: Status
      type: object
      required:
      - status
      title: OntologyChatMessageResponse
      description: Response after dispatching an ontology chat message.

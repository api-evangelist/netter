openapi: 3.1.0
info:
  title: DMI Backend actions dashboard-chat API
  version: 0.1.0
tags:
- name: dashboard-chat
paths:
  /api/v1/dashboard-chat/{chat_id}/message:
    post:
      tags:
      - dashboard-chat
      summary: Send Dashboard Chat Message
      description: Send a message to a dashboard-specific chat for targeted edits.
      operationId: send_dashboard_chat_message_api_v1_dashboard_chat__chat_id__message_post
      parameters:
      - name: chat_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Chat Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardChatRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Send Dashboard Chat Message Api V1 Dashboard Chat  Chat Id  Message Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    DashboardChatRequest:
      properties:
        content:
          type: string
          title: Content
        attachments:
          items:
            additionalProperties:
              type: string
            type: object
          type: array
          title: Attachments
          default: []
        referenced_database_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Referenced Database Ids
          default: []
      type: object
      required:
      - content
      title: DashboardChatRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError

aid: netter
name: Netter
description: >-
  Netter is a Y Combinator-backed AI data platform ("Build with your data, not
  your engineers") that centralizes a company's scattered data sources, cleans
  and enriches them into a living ontology, and lets teams turn that into
  dashboards, workflows, pipelines and AI-generated apps through chat rather than
  tickets. Netter exposes a public REST API (the "DMI Backend", rooted at
  /api/v1 on api.netter.ai) for programmatic file upload plus a broad application
  surface covering projects, pipelines, ontology entities/rows/relationships,
  integrations (Databricks, Snowflake, Salesforce, Slack, GitHub, Notion,
  PostgreSQL and more), dashboards, permissions and an assistant. Auth is an
  ntr_-prefixed bearer API key; enterprise controls include SAML 2.0 SSO and
  SCIM 2.0 provisioning.
url: https://raw.githubusercontent.com/api-evangelist/netter/refs/heads/main/apis.yml
